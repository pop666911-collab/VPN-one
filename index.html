<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oneok VPN — Подключение</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #151b23;
      --text: #e8edf2;
      --muted: #8b98a8;
      --accent: #2AABEE;
      --accent-hover: #1e96d6;
      --border: #232c38;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #16212b 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%; max-width: 420px; text-align: center;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 36px 24px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .logo { font-size: 64px; margin-bottom: 16px; filter: drop-shadow(0 0 20px rgba(42, 171, 238, 0.5)); }
    h1 { font-size: 1.8rem; margin-bottom: 10px; letter-spacing: -0.5px; }
    .bio { font-size: 0.95rem; color: var(--muted); line-height: 1.5; margin-bottom: 28px; }
    .btn {
      display: block; width: 100%; padding: 16px 20px;
      background: var(--accent); color: #fff; text-decoration: none;
      border-radius: 14px; font-size: 1.05rem; font-weight: 600;
      transition: all 0.2s ease; box-shadow: 0 8px 24px rgba(42, 171, 238, 0.35);
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(42, 171, 238, 0.5); }
    .btn:active { transform: translateY(0); }
    .footer { margin-top: 26px; font-size: 0.78rem; color: #5a6675; line-height: 1.4; }
    .hidden { display: none; }
    .hint {
      margin-top: 16px; padding: 12px 16px; background: rgba(42, 171, 238, 0.1);
      border: 1px solid rgba(42, 171, 238, 0.3); border-radius: 12px;
      font-size: 0.85rem; color: var(--muted); line-height: 1.5;
    }
    .hint b { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🛡️</div>
    <h1>Oneok VPN</h1>
    <p class="bio">Быстрый и безопасный VPN.<br>Подключение за 1 минуту прямо в Telegram.</p>

    <a id="openBtn" href="tg://resolve?domain=OneokVPNbot" class="btn" target="_blank" rel="noopener">
      🚀 Подключиться в Telegram
    </a>

    <div id="hint" class="hint hidden">
      Если чат не открылся, нажмите <b>три точки</b> в углу браузера Instagram и выберите <b>«Открыть в браузере»</b>.
    </div>

    <p class="footer">Нажмите кнопку — откроется бот <b>@OneokVPNbot</b></p>
  </div>

  <script>
    (function() {
      var BOT_USERNAME = 'OneokVPNbot';
      var APP_LINK = 'tg://resolve?domain=' + BOT_USERNAME;
      var WEB_LINK = 'https://t.me/' + BOT_USERNAME;
      var btn = document.getElementById('openBtn');
      var hint = document.getElementById('hint');

      var ua = navigator.userAgent || '';
      var isInApp = /Instagram|FBAN|FBAV|FB_IAB|TikTok|Bytedance|Line|Snapchat|Twitter/i.test(ua)
                 || (ua.indexOf('iPhone') > -1 && ua.indexOf('Safari') === -1);

      btn.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = APP_LINK;

        setTimeout(function() {
          if (isInApp) {
            hint.classList.remove('hidden');
          }
          if (document.visibilityState === 'visible') {
            window.location.href = WEB_LINK;
          }
        }, 1500);
      });

      if (isInApp) {
        setTimeout(function() {
          if (document.visibilityState === 'visible') {
            hint.classList.remove('hidden');
          }
        }, 3000);
      }
    })();
  </script>
</body>
</html>
