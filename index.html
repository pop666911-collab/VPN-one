<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Знакомства — Найди свою половинку</title>
  <meta property="og:title" content="Знакомства рядом с тобой">
  <meta property="og:description" content="Тысячи анкет. Начни общение прямо сейчас.">
  <style>
    :root {
      --bg: #1a0b1e;
      --card: #26102c;
      --text: #fff5fb;
      --muted: #c9a3c9;
      --accent: #ff2e63;
      --accent-2: #ff6b9d;
      --border: #3d1a44;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #3d0f3a 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%; max-width: 420px; text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 26px 30px;
      box-shadow: 0 24px 70px rgba(255, 46, 99, 0.25);
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(255,46,99,0.35), transparent 70%);
      border-radius: 50%;
      filter: blur(20px);
    }
    .logo {
      font-size: 68px;
      line-height: 1;
      margin-bottom: 14px;
      filter: drop-shadow(0 0 24px rgba(255,46,99,0.7));
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .bio {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 26px;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 26px;
      padding: 16px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat-num {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent-2 linear));
      -webkit-background-clip: text;
      -webkit-gradient-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 17px 20px;
      background:(90deg, var(--accent), var(--accent-2));
      color: #fff;
      text-decoration: none;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      transition: all 0.25s ease;
      box-shadow: 0 10px 30px rgba(255, 46, 99, 0.45);
      position: relative;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(255, 46, 99, 0.6);
    }
    .btn:active { transform: translateY(0); }
    .footer {
      margin-top: 22px;
      font-size: 0.78rem;
      color: #8a6a8a;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">💘</div>

    <h1>Найди <span>свою половинку</span><br>прямо сейчас</h1>

    <p class="bio">
      Тысячи реальных анкет рядом с тобой.<br>
      Общение, флирт и настоящие знакомства.
    </p>

    <div class="stats">
      <div>
        <div class="stat-num">18 542</div>
        <div class="stat-label">анкет</div>
      </div>
      <div>
        <div class="stat-num">4.8★</div>
        <div class="stat-label">рейтинг</div>
      </div>
      <div>
        <div class="stat-num">24/7</div>
        <div class="stat-label">онлайн</div>
      </div>
    </div>

    <!-- ПАРТНЕРСКАЯ ССЫЛКА -->
    <a id="openBtn" href="https://hort.affpmelody.com/click?pid=125967&offer_id=25" class="btn" target="_blank" rel="noopener">
      💬 Начать знакомиться
    </a>

    <p class="footer">
      18+ · Анкеты проверяются модерацией
    </p>
  </div>
</body>
</html>
