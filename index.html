<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скоро</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f7f8fa;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 360px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 0.95rem;
      color: #8a8f98;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Здесь скоро что-то будет</h1>
    <p>Страница находится в разработке.<br>Загляните позже.</p>
  </div>
</body>
</html>
